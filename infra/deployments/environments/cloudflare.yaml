schema: fibre-deployment
environment: cloudflare

runtimes:
  cloudflare:
    provider: cloudflare

infra:
  world-cloudflare:
    provider: cloudflare
    driver: cloudflare-v1
    capabilities:
      - state
      - scheduler
  birth-cloudflare:
    provider: cloudflare
    driver: cloudflare-v1
    capabilities:
      - state
      - scheduler
  cloudflare:
    provider: cloudflare
    driver: cloudflare-v1
    capabilities:
      - streams
      - objects
      - catalog
      - realtime
      - queues
      - workflows

integrations:
  asset-image-openai:
    kind: ai.image
    provider: openai
    config:
      model: gpt-image-2-2026-04-21
      acceptsReferenceObjects: false
      presentationDefault: true
      presentationReferenceDefault: false
    secrets:
      apiKey: OPENAI_API_KEY
  asset-image-bfl:
    kind: ai.image
    provider: bfl
    config:
      model: flux-2-pro
      acceptsReferenceObjects: true
      presentationDefault: false
      presentationReferenceDefault: true
    secrets:
      apiKey: BFL_API_KEY
  c2pa-production-http:
    kind: content-credentials
    provider: c2pa-http
    environment:
      baseUrl: C2PA_SIGNER_URL
      signerId: C2PA_SIGNER_ID
      trustPolicy: C2PA_TRUST_POLICY
      authorizationToken: C2PA_SIGNER_TOKEN

services:
  world-kernel:
    runtime: cloudflare
    infra: world-cloudflare
  birth-center:
    runtime: cloudflare
    infra: birth-cloudflare
  thread-presentation:
    runtime: cloudflare
    infra: cloudflare
    integrations:
      contentCredentials: c2pa-production-http
  asset-generator:
    runtime: cloudflare
    infra: cloudflare
    integrations:
      openai-gpt-image-2-medium-v1: asset-image-openai
      bfl-flux-2-pro-v1: asset-image-bfl
      contentCredentials: c2pa-production-http
