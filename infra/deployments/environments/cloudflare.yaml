schema: fibre-deployment
environment: cloudflare

runtimes:
  cloudflare:
    provider: cloudflare

infra:
  world-cloudflare:
    provider: cloudflare
    driver: cloudflare-v1
    capabilities:
      - state
      - scheduler
      - catalog
  birth-cloudflare:
    provider: cloudflare
    driver: cloudflare-v1
    capabilities:
      - state
      - scheduler
  fid-cloudflare:
    provider: cloudflare
    driver: cloudflare-v1
    capabilities:
      - state
      - objects
      - workflows
  cloudflare:
    provider: cloudflare
    driver: cloudflare-v1
    capabilities:
      - streams
      - objects
      - catalog
      - realtime
      - queues
      - workflows

integrations:
  lived-encounter-openai:
    kind: ai.reasoning
    provider: openai
    config:
      model: gpt-5.6-sol
      temperature: 0.3
      topP: 1
      reasoningEffort: none
      deferredServiceTier: flex
      cacheMode: explicit
      captureDepths:
        - gate
    secrets:
      apiKey: OPENAI_API_KEY
  # Workers AI candidates for the World's jobs, beside it on Cloudflare.
  # Selected for a job by naming the job's prompt id under a service's
  # integrations, e.g. "world.happening: lived-workers-ai-gemma4".
  # Meaning of exchanges (S5b repair): embeddings for World's fact of how far
  # an exchange repeats a Thread's earlier ones. World's measure, not cognition.
  meaning-workers-ai-bge-m3:
    kind: ai.embedding
    provider: cloudflare
    config:
      model: "@cf/baai/bge-m3"
      binding: AI
    environment:
      accountId: CLOUDFLARE_ACCOUNT_ID
    secrets:
      apiToken: CLOUDFLARE_AI_API_TOKEN
  lived-workers-ai-gemma4:
    kind: ai.reasoning
    provider: cloudflare
    config:
      model: "@cf/google/gemma-4-26b-a4b-it"
      binding: AI
      maxOutputTokens: 4096
      temperature: 0.3
      captureDepths:
        - gate
    environment:
      accountId: CLOUDFLARE_ACCOUNT_ID
    secrets:
      apiToken: CLOUDFLARE_AI_API_TOKEN
  lived-workers-ai-qwen3:
    kind: ai.reasoning
    provider: cloudflare
    config:
      model: "@cf/qwen/qwen3-30b-a3b-fp8"
      binding: AI
      maxOutputTokens: 2000
    environment:
      accountId: CLOUDFLARE_ACCOUNT_ID
    secrets:
      apiToken: CLOUDFLARE_AI_API_TOKEN
  genesis-openai-creative:
    kind: ai.reasoning
    provider: openai
    config:
      model: gpt-5.1-2025-11-13
      temperature: 0.3
      topP: 1
      reasoningEffort: none
    secrets:
      apiKey: OPENAI_API_KEY
  genesis-openai-repair:
    kind: ai.reasoning
    provider: openai
    config:
      model: gpt-5.1-2025-11-13
      temperature: 0
      topP: 1
      reasoningEffort: none
    secrets:
      apiKey: OPENAI_API_KEY
  asset-image-openai:
    kind: ai.image
    provider: openai
    config:
      model: gpt-image-2-2026-04-21
      acceptsReferenceObjects: true
      presentationDefault: true
      presentationReferenceDefault: true
    secrets:
      apiKey: OPENAI_API_KEY

services:
  world-kernel:
    runtime: cloudflare
    infra: world-cloudflare
    # Gemma 4 on Workers AI (Nov 16–19) failed encounter.attention in
    # model:quality: acceptable 35% against a 90% bar, noticing nothing in 70%
    # of moments. A job moves to another model only after it passes, by naming
    # its prompt id here, e.g. "world.happening: lived-workers-ai-gemma4".
    integrations:
      livedNow: lived-encounter-openai
      encounter: lived-encounter-openai
      meaning: meaning-workers-ai-bge-m3
  birth-center:
    runtime: cloudflare
    infra: birth-cloudflare
    integrations:
      creative: genesis-openai-creative
      repair: genesis-openai-repair
  fibre-identity-authority:
    runtime: cloudflare
    infra: fid-cloudflare
  thread-presentation:
    runtime: cloudflare
    infra: cloudflare
  asset-generator:
    runtime: cloudflare
    infra: cloudflare
    integrations:
      openai-gpt-image-2-medium-v1: asset-image-openai
