name: pr35-review-proof-closure

on:
  push:
    branches:
      - agent/structured-obligation-v1

permissions:
  contents: write

jobs:
  close:
    if: ${{ github.event.head_commit.message == 'Add PR35 hostile review closure proofs' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/structured-obligation-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Add isolated and adversarial regression proofs
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
            p=Path(path); t=p.read_text()
            if t.count(old) != 1:
              raise SystemExit(f'expected unique anchor in {path}: {old[:120]!r}')
            p.write_text(t.replace(old,new,1))

          def append_once(path, marker, addition):
            p=Path(path); t=p.read_text()
            if marker in t: return
            p.write_text(t.rstrip()+"\n\n"+addition.strip()+"\n")

          # I1 isolated proof: no authorization/discharge exists, so only policy re-derivation can catch the forgery.
          replace_once(
            'services/world-kernel/test/obligation-applicability-store.test.mjs',
            '''import { applicabilityDecisionDigest } from "../src/obligation-schema.mjs";''',
            '''import { applicabilityDecisionDigest } from "../src/obligation-schema.mjs";\nimport { canonicalJson } from "../src/persistence-common.mjs";\nimport { openStructuredObligationInspectionStore } from "../src/structured-obligation-inspection-store.mjs";''',
          )
          append_once(
            'services/world-kernel/test/obligation-applicability-store.test.mjs',
            'test("read-only inspection re-derives applicability policy without downstream authority witnesses"',
            '''test("read-only inspection re-derives applicability policy without downstream authority witnesses", () =>\n  withDatabase((databasePath) => {\n    const applicability = openObligationApplicabilityStore(databasePath);\n    const persisted = applicability.decideApplicability(decisionInput());\n    assert.equal(persisted.decision.result, "applies");\n    applicability.close();\n\n    const db = new DatabaseSync(databasePath, { enableForeignKeyConstraints: false });\n    try {\n      assert.equal(Number(db.prepare(\n        "SELECT COUNT(*) AS count FROM participation_authorizations",\n      ).get().count), 0);\n      assert.equal(Number(db.prepare(\n        "SELECT COUNT(*) AS count FROM structured_obligation_discharges",\n      ).get().count), 0);\n      db.exec("DROP TRIGGER obligation_applicability_decisions_no_update");\n      const forged = structuredClone(persisted.decision);\n      forged.result = "does_not_apply";\n      forged.reasonCode = "request_binding_mismatch";\n      const forgedDigest = applicabilityDecisionDigest(forged);\n      db.prepare(`\n        UPDATE obligation_applicability_decisions\n        SET result=?,reason_code=?,decision_json=?,decision_digest=?\n        WHERE applicability_id=?\n      `).run(\n        forged.result,\n        forged.reasonCode,\n        canonicalJson(forged),\n        forgedDigest,\n        forged.applicabilityId,\n      );\n    } finally {\n      db.close();\n    }\n\n    const inspector = openStructuredObligationInspectionStore(databasePath);\n    try {\n      assert.throws(\n        () => inspector.listRequestApplicability(fixture.threadId, request().requestId),\n        /applicability derived result does not match persisted evidence/,\n      );\n    } finally {\n      inspector.close();\n    }\n  }));''',
          )

          # I3 adversarial cases on the real process path.
          replace_once(
            'services/world-kernel/test/causal-process.test.mjs',
            '''    const authorizationId = continued.body.runtime.authorization.authorizationId;\n\n    const obligations = openObligationStore(databasePath);''',
            '''    const authorizationId = continued.body.runtime.authorization.authorizationId;\n\n    const prematureClosure = await json(\n      `${processHandle.baseUrl}/threads/${thread.threadId}/private/runtime/${sessionId}/authority-withdrawal`,\n      {\n        method: "POST",\n        headers: privateHeaders(),\n        body: JSON.stringify({\n          operationId: "op_causal_process_authority_withdrawal_live",\n          causationId: "cause_causal_process_authority_withdrawal_live",\n          correlationId: "corr_causal_process_revoked",\n        }),\n      },\n    );\n    assert.equal(prematureClosure.response.status, 422);\n    assert.equal(prematureClosure.body.error.code, "AUTHORITY_WITHDRAWAL_REJECTED");\n    assert.match(prematureClosure.body.error.message, /remains current execution authority/);\n\n    const stillActive = await json(\n      `${processHandle.baseUrl}/threads/${thread.threadId}/private/runtime/${sessionId}`,\n      { headers: { "x-fibre-private-token": privateToken } },\n    );\n    assert.equal(stillActive.body.runtime.session.status, "active");\n    assert.equal(stillActive.body.runtime.lease.status, "active");\n\n    const obligations = openObligationStore(databasePath);''',
          )
          replace_once(
            'services/world-kernel/test/causal-process.test.mjs',
            '''    assert.equal(closed.body.closure.guardianDecision, "pass");\n\n    const closedRuntime = await json(''',
            '''    assert.equal(closed.body.closure.guardianDecision, "pass");\n\n    const exactRetry = await json(\n      `${processHandle.baseUrl}/threads/${thread.threadId}/private/runtime/${sessionId}/authority-withdrawal`,\n      {\n        method: "POST",\n        headers: privateHeaders(),\n        body: JSON.stringify({\n          operationId: "op_causal_process_authority_withdrawal",\n          causationId: "cause_causal_process_authority_withdrawal",\n          correlationId: "corr_causal_process_revoked",\n        }),\n      },\n    );\n    assert.equal(exactRetry.response.status, 200);\n    assert.equal(exactRetry.body.idempotent, true);\n    assert.deepEqual(exactRetry.body.closure, closed.body.closure);\n\n    const conflictingReuse = await json(\n      `${processHandle.baseUrl}/threads/${thread.threadId}/private/runtime/${sessionId}/authority-withdrawal`,\n      {\n        method: "POST",\n        headers: privateHeaders(),\n        body: JSON.stringify({\n          operationId: "op_causal_process_authority_withdrawal_second",\n          causationId: "cause_causal_process_authority_withdrawal_second",\n          correlationId: "corr_causal_process_revoked",\n        }),\n      },\n    );\n    assert.equal(conflictingReuse.response.status, 409);\n    assert.equal(conflictingReuse.body.error.code, "AUTHORITY_WITHDRAWAL_CONFLICT");\n\n    const closedRuntime = await json(''',
          )
          PY
      - name: Focused hostile-review proofs
        run: |
          npm run build
          node --disable-warning=ExperimentalWarning --test services/world-kernel/test/obligation-applicability-store.test.mjs services/world-kernel/test/causal-process.test.mjs
      - name: Full validation
        run: npm run check
      - name: Commit proofs
        shell: bash
        run: |
          git config user.name "OpenAI review-fix bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pr35-review-proof-closure.yml
          git add -A
          git commit -m "Add hostile review regression proofs for PR35"
          git push origin HEAD:agent/structured-obligation-v1
