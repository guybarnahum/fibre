name: pr35-review-doc-sync

on:
  push:
    branches:
      - agent/structured-obligation-v1

permissions:
  contents: write

jobs:
  sync:
    if: ${{ github.event.head_commit.message == 'Synchronize PR35 hostile review closure docs' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/structured-obligation-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Synchronize canonical docs
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
            p=Path(path); t=p.read_text()
            if t.count(old) != 1:
              raise SystemExit(f'expected unique anchor in {path}: {old[:140]!r}')
            p.write_text(t.replace(old,new,1))

          def update_reviewed(path):
            p=Path(path); t=p.read_text()
            t=t.replace('last-reviewed: 2026-08-09','last-reviewed: 2026-08-12',1)
            t=t.replace('last-reviewed: 2026-08-10','last-reviewed: 2026-08-12',1)
            p.write_text(t)

          for path in [
            'docs/architecture/structured-obligations-v1.md',
            'docs/architecture/storage-model.md',
            'docs/state/current-state.md',
            'docs/state/current-priorities.md',
            'docs/validation/m2-pr-plan.md',
          ]:
            update_reviewed(path)

          # Structured Obligation canonical design: inspection + hostile-review closure + interrupted episode semantics.
          replace_once(
            'docs/architecture/structured-obligations-v1.md',
            '''GET /threads/:threadId/private/runtime/:sessionId/obligation-discharge\n```''',
            '''GET /threads/:threadId/private/runtime/:sessionId/obligation-discharge\nGET /threads/:threadId/private/runtime/:sessionId/authority-withdrawal\n```''',
          )
          replace_once(
            'docs/architecture/structured-obligations-v1.md',
            '''No Thread Editor mutation or new editor authority is introduced by F.\n\n## Required #35 adversarial cases''',
            '''No Thread Editor mutation or new editor authority is introduced by F.\n\n## Hostile-review closure\n\nThe post-A-F hostile review strengthened the implementation without changing the central authority model. The review attacked caller escalation, stale applicability, consent representation, privacy, migration, replay, and semantic overclaiming. The authority core held; the fixes close downstream evidence and lifecycle gaps.\n\n### Discharge is bidirectional evidence\n\n`ObligationStore.recordRevision(...)` may not author `status = discharged`. Only the atomic structured freeze/discharge path may create that terminal social fact. Read-only inspection checks both directions:\n\n```text\ndischarge witness -> exact terminal discharged revision\nterminal discharged revision -> exactly one valid discharge witness\n```\n\nA terminal consequence with no causal witness is therefore corruption, not a valid obligation state.\n\n### Applicability is re-derived during inspection\n\nThe read-only verifier does not merely recompute the digest of `decision_json`. It reruns `deterministicApplicability(...)` from the persisted obligation, request fingerprint, decision time, and legacy tombstone state, and requires the stored `result` and `reasonCode` to match. This remains effective even when no downstream authorization or discharge witness exists.\n\n### Structured compulsion is the presentation authority\n\nAfter the D cutover, legacy `authorization.obligationReferences` is intentionally empty for Structured Obligations. Downstream disclosure and human-readable/editor surfaces therefore consume the authoritative structured fields:\n\n```text\nauthorization.participationBasis\nauthorization.applicability.applicabilityId\nauthorization.applicability.obligationId\n```\n\nA compelled episode is displayed and disclosed as compelled participation, not as willing acceptance and not as “not recorded.” The SQL rule that keeps legacy prose references empty remains intact.\n\n### Authority withdrawn after execution is an interrupted historical episode\n\nIf a structured obligation is revised, revoked, expires, or becomes tombstoned after Actor execution has begun, freeze correctly refuses to consume stale authority. Fibre must also avoid leaving the episode permanently active or erasing the fact that execution occurred.\n\nFor the narrow v1 case:\n\n```text\nstructured obligation_override authorization\n  -> Actor run exists\n  -> Goal Guardian pass exists\n  -> governing authority is no longer current/live\n  -> no freeze, consumption, or discharge exists\n  -> atomic authority-withdrawal closure\n  -> runtime aborted\n  -> lease released with governing_authority_withdrawn\n  -> authorization remains unconsumed\n  -> obligation remains undischargeable under that episode\n  -> interrupted execution remains append-only, inspectable history\n```\n\nThe append-only record is `structured_authority_withdrawal_closures` with `obw_<64 hex>` identity. It binds the authorization, applicability, authorized obligation revision, current withdrawal-causing revision/state, Actor output, Guardian pass, operation lineage, and closure time. Exact retry is idempotent; a second operation cannot reuse the same session. The closure is rejected while authority is still live.\n\nThis is intentionally distinct from historical `runtime_abandons`, whose meaning remains `guardian_rejected`. Fibre does not falsify a Guardian pass into a rejection merely to obtain lifecycle closure.\n\n### Additional hostile-review hardening\n\n- `verifyFreezeIntegrity(...)` now requires exactly one Structured Obligation discharge for `obligation_override` freeze and zero for willing freeze;\n- expected obligation/applicability conflict and not-found outcomes are mapped to bounded 4xx responses instead of false 500 integrity incidents;\n- top-level Thread snapshots are exact-keyed so public state cannot spoof `obl_`-shaped authoritative vocabulary;\n- same-version additive schema repair plus legacy tombstone derivation is transactional;\n- freeze verifies guarded runtime/lease update counts and reconstructs its persisted result before commit, avoiding a committed mutation being reported as a post-commit decode failure.\n\n## Required #35 adversarial cases''',
          )
          replace_once(
            'docs/architecture/structured-obligations-v1.md',
            '''D authorized runtime, then obligation advances/revokes before freeze\n    -> freeze rejected atomically\n    -> no authorization consumption\n    -> no freeze report\n    -> no structured discharge\n''',
            '''D authorized runtime, then obligation advances/revokes before freeze\n    -> freeze rejected atomically\n    -> no authorization consumption\n    -> no freeze report\n    -> no structured discharge\n    -> if Actor executed and Guardian passed, governing_authority_withdrawn closes the runtime truthfully\n    -> authorization remains unconsumed and interrupted execution remains inspectable\n''',
          )

          # Storage model: current #35 tables and truthful interrupted-runtime lifecycle.
          replace_once(
            'docs/architecture/storage-model.md',
            '''- `legacy_obligation_tombstones` preserves deterministic evidence that an exact pre-#35 obligation reference was already consumed and therefore cannot be reactivated through migration.\n\nThe first #35 storage slice is deliberately **non-authoritative**: adding these tables does not yet alter the legacy runtime's `obligationReferences` behavior. Authority moves only when the later #35 cutover binds persisted Fibre applicability into Participation Authorization and freeze/discharge.''',
            '''- `legacy_obligation_tombstones` preserves deterministic evidence that an exact pre-#35 obligation reference was already consumed and therefore cannot be reactivated through migration;\n- `structured_obligation_discharges` binds a successful one-shot compelled freeze to its exact prior and terminal obligation revisions plus applicability, authorization, consumption, runtime, freeze-report, and event witnesses;\n- `structured_authority_withdrawal_closures` preserves an executed-but-interrupted compelled episode when its governing authority becomes stale after Actor execution and Guardian pass but before freeze.\n\nThe additive tables share schema version 4, but the canonical runtime authority is no longer the historical exact-prose path: Structured Obligation authority now requires Fibre-owned persisted applicability plus current-authority revalidation. Historical M1 prose evidence retains its original replay semantics.''',
          )
          replace_once(
            'docs/architecture/storage-model.md',
            '''Rejected-runtime closure uses a fourth interface over the same file. One immediate abandonment transaction rereads the active session, lease, authorization, and persisted Guardian reject, then appends the abandonment record, aborts the session, and releases the lease without advancing Thread life state or consuming authority.\n\nThe separate WorldStore, RuntimeStore, FreezeStore, and LifecycleHardeningStore handles preserve interface boundaries, not independent consistency domains.''',
            '''Rejected-runtime closure uses a fourth interface over the same file. One immediate abandonment transaction rereads the active session, lease, authorization, and persisted Guardian reject, then appends the abandonment record, aborts the session, and releases the lease without advancing Thread life state or consuming authority.\n\nStructured authority-withdrawal closure uses a separate bounded interface over the same file. It applies only to a structured compelled runtime with Actor evidence and Goal Guardian pass when the exact governing authority has become superseded, non-active, expired, or legacy-tombstoned before freeze. One immediate transaction appends the immutable withdrawal closure, aborts the runtime, and releases the lease with `governing_authority_withdrawn`; it records no freeze, consumes no authorization, and does not discharge the obligation.\n\nThe separate WorldStore, RuntimeStore, FreezeStore, LifecycleHardeningStore, Structured Obligation stores, and authority-withdrawal store preserve interface boundaries, not independent consistency domains.''',
          )
          replace_once(
            'docs/architecture/storage-model.md',
            '''Events, commands, requests, appraisals, private stances, authorizations, Actor runs, Guardian audits, runtime abandonments, authorization consumptions, freeze reports, accepted memory rows, obligation revisions, applicability decisions, and legacy-obligation tombstones are append-only.''',
            '''Events, commands, requests, appraisals, private stances, authorizations, Actor runs, Guardian audits, runtime abandonments, structured authority-withdrawal closures, authorization consumptions, freeze reports, accepted memory rows, obligation revisions, applicability decisions, structured obligation discharges, and legacy-obligation tombstones are append-only.''',
          )

          # Current-state checkpoint: hostile review is now a distinct completed fix pass, re-review still pending.
          replace_once(
            'docs/state/current-state.md',
            '''Structured inspection profile v1 verifies obligation revision history, persisted request/applicability witnesses, authorization, authorization consumption, runtime completion, freeze report/event, terminal obligation revision, and immutable discharge witness as one coherent chain.\n\nThe completed #35 implementation does **not** move the pre-M2 personhood score.''',
            '''Structured inspection profile v1 verifies obligation revision history, persisted request/applicability witnesses, authorization, authorization consumption, runtime completion, freeze report/event, terminal obligation revision, and immutable discharge witness as one coherent chain.\n\nA hostile post-A-F review found three blocking downstream inconsistencies and several important hardening gaps while independently confirming the core authority model held. The branch now closes those findings: public `ObligationStore` cannot mint `discharged`; terminal discharge verification is bidirectional; applicability is re-derived during read-only inspection; disclosure/editor surfaces consume structured `participationBasis` and applicability instead of retired prose references; freeze integrity understands structured discharge; expected obligation conflicts are bounded 4xx; public Thread snapshots are exact-keyed; and stale authority after Actor execution/Guardian pass closes through append-only `governing_authority_withdrawn` evidence rather than leaving a permanent active runtime or falsifying a Guardian reject.\n\nThe authority-withdrawal closure records an interrupted episode without freeze, authorization consumption, or obligation discharge. It is rejected while authority remains live, exact retries are idempotent, conflicting reuse is rejected, and private stance plus closure evidence survive restart inspection.\n\nThe completed #35 implementation does **not** move the pre-M2 personhood score.''',
          )
          replace_once(
            'docs/state/current-state.md',
            '''PR #35 structured obligation  IMPLEMENTATION COMPLETE / DRAFT REVIEW PENDING''',
            '''PR #35 structured obligation  IMPLEMENTATION + HOSTILE-REVIEW FIXES COMPLETE / DRAFT RE-REVIEW PENDING''',
          )

          # Priorities: focused hostile re-review is now the next action, not more #35 feature work.
          replace_once(
            'docs/state/current-priorities.md',
            '''**#35 Structured Obligation v1 has A-F implementation complete and remains Draft pending review/merge.** After #35 merges,''',
            '''**#35 Structured Obligation v1 has A-F implementation plus hostile-review fixes complete and remains Draft pending focused re-review/merge.** After #35 merges,''',
          )
          replace_once(
            'docs/state/current-priorities.md',
            '''7. Treat #35 A-F as one reviewed integrity chain: **A)** domain/schema/migration + legacy-spend tombstones; **B)** ObligationStore/current-revision integrity; **C)** persisted Fibre applicability; **D)** runtime authorization cutover; **E)** atomic freeze/discharge cutover; **F)** read-only private/admin inspection with restart/replay/privacy/adversarial closure. Do not expand #35 during review into semantic natural-language applicability, recurrence semantics, editor mutation, or personhood-score work.''',
            '''7. Treat #35 A-F plus the hostile-review closure as one integrity chain: **A)** domain/schema/migration + legacy-spend tombstones; **B)** ObligationStore/current-revision integrity; **C)** persisted Fibre applicability; **D)** runtime authorization cutover; **E)** atomic freeze/discharge cutover; **F)** read-only private/admin inspection; **review closure)** bidirectional discharge evidence, policy re-derivation, truthful structured compulsion presentation, structured freeze integrity, exact public Thread shape, bounded HTTP conflicts, and `governing_authority_withdrawn` interrupted-runtime history. Do not expand #35 during re-review into semantic natural-language applicability, recurrence semantics, editor mutation, or personhood-score work.''',
          )
          replace_once(
            'docs/state/current-priorities.md',
            '''15. Continue targeted adversarial hardening, especially mutation baselines, crash/concurrency cases, cross-connection races, source-integrity reporting, model-evaluation holdout discipline, semantic-state injection/staleness/selection discipline, cross-Thread private-state leakage, and obligation cross-chain integrity. Coherently re-signed storage must not defeat independent causal-chain verification.''',
            '''15. Run one focused hostile re-review of #35 against the prior findings before moving the PR out of Draft. Preserve the new proofs: a discharged revision requires exactly one discharge witness; applicability outcome is independently re-derived even with no downstream authority witness; structured compulsion remains human-visible without legacy prose refs; live authority cannot be closed as withdrawn; stale authority after execution closes idempotently and restart-safely without consumption/discharge. Continue broader adversarial hardening afterward; coherently re-signed storage must not defeat independent causal-chain verification.''',
          )

          # M2 plan: record the review closure but keep score and next PR unchanged.
          replace_once(
            'docs/validation/m2-pr-plan.md',
            '''**F is the inspection/replay closure:** a shared `readOnly + query_only` verifier checks the complete obligation/applicability/authorization/consumption/runtime/freeze/event/discharge chain. It is exposed through private GET-only world-kernel routes and `npm run inspect:obligations`; exact private inspection survives process restart; public Thread/event/health routes reveal no private obligation evidence; and coherently re-signed discharge-row tampering still fails cross-chain verification.\n\n#35 remains primarily authority integrity and social consequence.''',
            '''**F is the inspection/replay closure:** a shared `readOnly + query_only` verifier checks the complete obligation/applicability/authorization/consumption/runtime/freeze/event/discharge chain. It is exposed through private GET-only world-kernel routes and `npm run inspect:obligations`; exact private inspection survives process restart; public Thread/event/health routes reveal no private obligation evidence; and coherently re-signed discharge-row tampering still fails cross-chain verification.\n\n**Hostile-review closure is also complete on the Draft branch.** It forbids direct authoring of `discharged`, verifies terminal discharge in both directions, re-derives deterministic applicability during inspection, moves disclosure/editor presentation to structured `participationBasis` + applicability, binds structured discharge into freeze integrity, exact-keys public Thread snapshots, maps expected obligation conflicts to bounded 4xx responses, and adds append-only `governing_authority_withdrawn` closure for an executed/Guardian-passed compelled runtime whose authority becomes stale before freeze. That interrupted closure consumes no authorization and discharges no obligation; it preserves the episode as durable inspectable history.\n\n#35 remains primarily authority integrity and social consequence.''',
          )
          PY
      - name: Validate synchronized docs
        run: npm run check
      - name: Commit synchronized docs
        shell: bash
        run: |
          git config user.name "OpenAI review-fix bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pr35-review-doc-sync.yml
          git add -A
          git commit -m "Document PR35 hostile review closure"
          git push origin HEAD:agent/structured-obligation-v1
