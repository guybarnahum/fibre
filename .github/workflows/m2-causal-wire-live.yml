name: m2-causal-wire-live

on:
  pull_request:
    paths:
      - ".github/workflows/m2-causal-wire-live.yml"
      - "tools/m2-causal-wire-live-proof.mjs"
      - "services/world-kernel/src/m2-identity-causal-wire.mjs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  openai-live-preflight:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'agent/m2-causal-wire-preflight'
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      FIBRE_GUARDIAN_MODEL_ID: gpt-5.6-luna
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Require live OpenAI credential
        run: test -n "$OPENAI_API_KEY" || { echo "::error::OPENAI_API_KEY is not configured for the real-model causal-wire preflight."; exit 1; }
      - name: Run real-model causal-wire preflight
        run: node tools/m2-causal-wire-live-proof.mjs
