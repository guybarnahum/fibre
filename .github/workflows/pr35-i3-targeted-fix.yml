name: pr35-i3-targeted-fix

on:
  push:
    branches:
      - agent/structured-obligation-v1

permissions:
  contents: write

jobs:
  fix:
    if: ${{ github.event.head_commit.message == 'Apply targeted PR35 I3 verifier fix' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/structured-obligation-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fix only authority-withdrawal verifier shape
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          p = Path('services/world-kernel/src/structured-obligation-inspection-store.mjs')
          t = p.read_text()
          replacements = [
            (
              'same("authority withdrawal current revision", current.obligation.revision, closure.currentObligationRevision);',
              'same("authority withdrawal current revision", current.revision, closure.currentObligationRevision);',
            ),
            (
              'same("authority withdrawal current status", current.obligation.status, closure.currentObligationStatus);',
              'same("authority withdrawal current status", current.status, closure.currentObligationStatus);',
            ),
          ]
          for old, new in replacements:
            if t.count(old) != 1:
              raise SystemExit(f'expected unique targeted verifier anchor: {old}')
            t = t.replace(old, new, 1)
          # Assert the unrelated history verifier remains structurally intact.
          for required in [
            'same("obligation history revision", current.obligation.revision, expectedRevision);',
            'if (terminalStatus !== null && current.obligation.status !== terminalStatus)',
          ]:
            if required not in t:
              raise SystemExit(f'assertHistory was unexpectedly changed: {required}')
          p.write_text(t)
          PY
      - name: Focused inspection and lifecycle proofs
        run: |
          npm run build
          node --disable-warning=ExperimentalWarning --test services/world-kernel/test/causal-process.test.mjs services/world-kernel/test/structured-obligation-inspection-process.test.mjs
      - name: Full validation
        run: npm run check
      - name: Commit verified fix
        shell: bash
        run: |
          git config user.name "OpenAI review-fix bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/pr35-fix-i3-inspector.yml .github/workflows/pr35-i3-targeted-fix.yml
          git add -A
          git commit -m "Verify structured authority withdrawal without weakening history checks"
          git push origin HEAD:agent/structured-obligation-v1
