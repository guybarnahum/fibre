name: validate
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check Markdown projections
        run: npm run includes:check
      - name: Build
        run: npm run build
      - name: Test domain package
        run: node --disable-warning=ExperimentalWarning --test packages/domain/test/*.test.mjs
      - name: Test Slice C memory
        run: node --disable-warning=ExperimentalWarning --test services/world-kernel/test/autobiographical-memory.test.mjs
      - name: Test identity
        run: node --disable-warning=ExperimentalWarning --test services/world-kernel/test/identity-*.test.mjs
      - name: Test situated life
        run: node --disable-warning=ExperimentalWarning --test services/world-kernel/test/situated-*.test.mjs
      - name: Test embodiment
        run: node --disable-warning=ExperimentalWarning --test services/world-kernel/test/embodiment-*.test.mjs
      - name: Test remaining world-kernel
        run: |
          files=$(find services/world-kernel/test -name '*.test.mjs' | grep -Ev '/(autobiographical-memory|identity-|situated-|embodiment-)')
          node --disable-warning=ExperimentalWarning --test $files
      - name: Test repository tooling
        run: node --disable-warning=ExperimentalWarning --test tools/*.test.mjs
      - name: Build AI context pack
        run: npm run context-pack
      - name: Validate generated repository
        run: node tools/validate-repo.mjs --generated
