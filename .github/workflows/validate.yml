name: validate
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run check
      - run: npm run test:all
      - run: npm run validate
      - run: npm run test:audit -- --check
      - run: npx --yes wrangler@4.126.0 deploy --dry-run --config infra/deployments/asset-generator/cloudflare/wrangler.jsonc
      - run: npx --yes wrangler@4.126.0 deploy --dry-run --config infra/deployments/thread-presentation/cloudflare/wrangler.jsonc
