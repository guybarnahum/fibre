name: validate
on: [push, pull_request]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: install dependencies
        run: npm ci
      - name: secret pattern guard
        run: |
          node -e '
            const fs = require("node:fs");
            const { execFileSync } = require("node:child_process");
            const files = execFileSync("git", ["ls-files"], { encoding: "utf8" }).trim().split("\n");
            const patterns = [
              { name: "OpenAI key", re: /\bsk-(?:proj-|admin-)?[A-Za-z0-9_-]{20,}\b/ },
              { name: "Anthropic key", re: /\bsk-ant-[A-Za-z0-9_-]{20,}\b/ },
              { name: "Google API key", re: /\bAIza[0-9A-Za-z_-]{35}\b/ },
              { name: "AWS access key", re: /\bAKIA[0-9A-Z]{16}\b/ },
              { name: "Private key PEM", re: /-----BEGIN (?:RSA |EC |OPENSSH |)PRIVATE KEY-----/ },
              { name: "GitHub token", re: /\b(?:ghp|gho|ghu|ghs|ghr)_[A-Za-z0-9]{36}\b/ },
              { name: "BFL key", re: /\bbfl_[A-Za-z0-9_-]{20,}\b/ },
            ];
            const allowFixture = new Set(["services/asset-generator/test/provider-adapters.test.mjs"]);
            const hits = [];
            for (const f of files) {
              if (allowFixture.has(f) || /\.(png|jpg|jpeg|webp|gif|pdf|woff2?|ttf|ico|sqlite|docx)$/i.test(f)) continue;
              let txt;
              try { txt = fs.readFileSync(f, "utf8"); } catch { continue; }
              txt.split("\n").forEach((line, i) => {
                for (const p of patterns) if (p.re.test(line)) hits.push(`${p.name}: ${f}:${i + 1}`);
              });
            }
            if (hits.length) {
              console.error("Potential secret patterns detected:\n" + hits.join("\n"));
              process.exit(1);
            }
            console.log(`✓ secret pattern guard passed (${files.length} tracked files)`);
          '
      - name: slice validate
        run: |
          log="$RUNNER_TEMP/slice-validate.log"
          echo "=== slice:validate ==="
          if npm run slice:validate > "$log" 2>&1; then
            grep -E '^(FIBRE-TEST-SUITE:|tests [0-9]+|Validation passed:|Markdown include|Generated prompts)' "$log" || true
            echo "✓ slice:validate passed"
          else
            cat "$log"
            exit 1
          fi
      - name: dry-run cloudflare workers
        run: |
          for cfg in \
            infra/deployments/asset-generator/cloudflare/wrangler.jsonc \
            infra/deployments/thread-presentation/cloudflare/wrangler.jsonc \
            infra/deployments/world-kernel/cloudflare/wrangler.jsonc \
            infra/deployments/fibre-identity-authority/cloudflare/wrangler.jsonc \
            infra/deployments/birth-center/cloudflare/wrangler.jsonc \
            infra/deployments/admin-dashboard/cloudflare/wrangler.jsonc \
            infra/deployments/status-page/cloudflare/wrangler.jsonc; do
            log="$RUNNER_TEMP/$(basename "$(dirname "$(dirname "$cfg")")").log"
            if npx --yes wrangler@4.151.0 deploy --dry-run --config "$cfg" > "$log" 2>&1; then
              echo "✓ dry-run passed: $cfg"
            else
              cat "$log"
              exit 1
            fi
          done
