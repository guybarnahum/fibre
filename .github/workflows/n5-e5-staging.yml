name: n5-e5-staging

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/n5-e5-staging.yml"
      - "tools/validation/n5-e5-staging.mjs"
      - "services/world-kernel/src/lived-environmental-encounter-write-api.mjs"
      - "services/world-kernel/src/lived-social-meeting-write-api.mjs"
      - "infra/deployments/world-kernel/cloudflare/encounter-worker.mjs"
      - "apps/admin-dashboard/thread-journal-presentation.mjs"
      - "apps/admin-dashboard/thread-observatory.js"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: n5-e5-staging
  cancel-in-progress: false

jobs:
  staging-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      BFL_API_KEY: ${{ secrets.BFL_API_KEY }}
      FIBRE_PRIVATE_TOKEN: ${{ secrets.FIBRE_PRIVATE_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      FIA_ISSUER_JWK: ${{ secrets.FIA_ISSUER_JWK }}
      FIA_CREDENTIAL_KEY_BASE64: ${{ secrets.FIA_CREDENTIAL_KEY_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Require staging operator secrets
        run: |
          node --input-type=module <<'NODE'
          const required = [
            "OPENAI_API_KEY",
            "BFL_API_KEY",
            "FIBRE_PRIVATE_TOKEN",
            "CLOUDFLARE_ACCOUNT_ID",
            "CLOUDFLARE_API_TOKEN",
            "FIA_ISSUER_JWK",
            "FIA_CREDENTIAL_KEY_BASE64",
          ];
          const missing = required.filter((name) => !process.env[name]?.trim());
          if (missing.length) throw new Error(`Missing staging secrets: ${missing.join(", ")}`);
          NODE

      - name: Write operator environment
        run: |
          node --input-type=module <<'NODE'
          import { writeFileSync } from "node:fs";
          const names = [
            "OPENAI_API_KEY",
            "BFL_API_KEY",
            "FIBRE_PRIVATE_TOKEN",
            "CLOUDFLARE_ACCOUNT_ID",
            "CLOUDFLARE_API_TOKEN",
            "FIA_ISSUER_JWK",
            "FIA_CREDENTIAL_KEY_BASE64",
          ];
          const lines = names.map((name) => {
            const value = process.env[name];
            if (/\r|\n/u.test(value)) throw new Error(`${name} must be single-line`);
            return `${name}=${value}`;
          });
          writeFileSync(".env", `${lines.join("\n")}\n`, { mode:0o600 });
          NODE

      - name: Validate E5 source
        run: npm run slice:validate

      - name: Prepare staging
        run: npm run cloud:prepare:staging

      - name: Run N5 E5 staging acceptance
        run: node tools/validation/n5-e5-staging.mjs
