name: cloud-runtime-source-snapshot

on:
  push:
    branches:
      - agent/cloud-runtime-infradriver

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: cloud-runtime-source-${{ github.sha }}
          path: .
          include-hidden-files: true
          retention-days: 1
