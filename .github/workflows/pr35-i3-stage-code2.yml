name: pr35-i3-stage-code2

on:
  push:
    branches:
      - agent/structured-obligation-v1

permissions:
  contents: write

jobs:
  stage:
    if: ${{ github.event.head_commit.message == 'Stage PR35 I3 code with safe cleanup' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/structured-obligation-v1
          fetch-depth: 0
      - name: Apply known I3 candidate
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          source=Path('.github/workflows/pr35-i3-finalize.yml').read_text()
          marker='      - name: Apply corrected closure and route ownership\n        shell: bash\n        run: |\n'
          start=source.index(marker)+len(marker)
          end=source.index('\n      - name: Focused causal proof',start)
          lines=source[start:end].splitlines()
          Path('/tmp/apply.sh').write_text('\n'.join(line[10:] if line.startswith('          ') else line for line in lines)+'\n')
          PY
          bash /tmp/apply.sh
          python <<'PY'
          from pathlib import Path
          p=Path('services/world-kernel/src/structured-authority-withdrawal.mjs'); t=p.read_text()
          t=t.replace('return sha256(canonicalJson(normalizeStructuredAuthorityWithdrawal(value)));','return `sha256:${sha256(canonicalJson(normalizeStructuredAuthorityWithdrawal(value)))}`;')
          p.write_text(t)
          p=Path('services/world-kernel/src/structured-authority-withdrawal-store.mjs'); t=p.read_text()
          old='''  return sha256(canonicalJson({\n    kind: "structured_authority_withdrawal/1",\n    operationId: input.operationId,\n    threadId: input.threadId,\n    sessionId: input.sessionId,\n    causationId: input.causationId,\n    correlationId: input.correlationId,\n  }));'''
          new='''  return `sha256:${sha256(canonicalJson({\n    kind: "structured_authority_withdrawal/1",\n    operationId: input.operationId,\n    threadId: input.threadId,\n    sessionId: input.sessionId,\n    causationId: input.causationId,\n    correlationId: input.correlationId,\n  }))}`;'''
          if old not in t: raise SystemExit('operation digest anchor missing')
          p.write_text(t.replace(old,new,1))
          PY
          for f in .github/workflows/pr35-i3-closure.yml .github/workflows/pr35-i3-retry.yml .github/workflows/pr35-i3-debug.yml .github/workflows/pr35-i3-finalize.yml .github/workflows/pr35-i3-stack.yml .github/workflows/pr35-i3-land.yml .github/workflows/pr35-i3-stack2.yml .github/workflows/pr35-i3-diagnose.yml .github/workflows/pr35-i3-inspect-debug.yml .github/workflows/pr35-i3-stage-code.yml .github/workflows/pr35-i3-stage-code2.yml; do
            if [ -e "$f" ]; then git rm -f "$f"; fi
          done
      - name: Commit staged I3 code
        shell: bash
        run: |
          git config user.name "OpenAI review-fix bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Stage authority-withdrawal closure for direct verification"
          git push origin HEAD:agent/structured-obligation-v1
