name: pr35-i3-retry

on:
  push:
    branches:
      - agent/structured-obligation-v1

permissions:
  contents: write

jobs:
  fix:
    if: ${{ github.event.head_commit.message == 'Retry PR35 authority-withdrawal closure' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/structured-obligation-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Reapply and correct authority-withdrawal closure
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/pr35-i3-closure.yml').read_text()
          marker = '      - name: Implement truthful authority-withdrawal closure\n        shell: bash\n        run: |\n'
          start = source.index(marker) + len(marker)
          end = source.index('\n      - name: Validate closure and review fixes', start)
          lines = source[start:end].splitlines()
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n'
          Path('/tmp/apply-i3.sh').write_text(script)
          PY
          bash /tmp/apply-i3.sh

          python <<'PY'
          from pathlib import Path

          # normalizeStructuredObligation returns the obligation directly, not { obligation: ... }.
          p = Path('services/world-kernel/src/structured-authority-withdrawal-store.mjs')
          t = p.read_text()
          t = t.replace('current.obligation.revision', 'current.revision')
          t = t.replace('current.obligation.status', 'current.status')
          t = t.replace('current.obligation.expiresAt', 'current.expiresAt')
          p.write_text(t)

          # Direct/noncanonical service construction remains compatible; canonical server always supplies the store.
          p = Path('services/world-kernel/src/structured-causal-service.mjs')
          t = p.read_text()
          old = '''    const authorityWithdrawalStore = options.authorityWithdrawalStore;\n    if (authorityWithdrawalStore === null || typeof authorityWithdrawalStore !== "object") {\n      throw new TypeError("authorityWithdrawalStore is required for truthful Structured Obligation lifecycle closure");\n    }\n    for (const method of ["closeWithdrawnAuthority", "getClosure"]) {\n      if (typeof authorityWithdrawalStore[method] !== "function") {\n        throw new TypeError(`authorityWithdrawalStore.${method} is required for truthful Structured Obligation lifecycle closure`);\n      }\n    }'''
          new = '''    const authorityWithdrawalStore = options.authorityWithdrawalStore ?? null;\n    if (authorityWithdrawalStore !== null) {\n      if (typeof authorityWithdrawalStore !== "object") {\n        throw new TypeError("authorityWithdrawalStore must be an object when provided");\n      }\n      for (const method of ["closeWithdrawnAuthority", "getClosure"]) {\n        if (typeof authorityWithdrawalStore[method] !== "function") {\n          throw new TypeError(`authorityWithdrawalStore.${method} is required when authority-withdrawal closure is enabled`);\n        }\n      }\n    }'''
          if old not in t:
            raise SystemExit('authorityWithdrawalStore constructor anchor missing')
          t = t.replace(old, new, 1)
          old = '''    return this.#authorityWithdrawalStore.closeWithdrawnAuthority({\n      operationId: submission.operationId,'''
          new = '''    if (this.#authorityWithdrawalStore === null) {\n      throw new TypeError("authority-withdrawal closure is not configured on this service instance");\n    }\n    return this.#authorityWithdrawalStore.closeWithdrawnAuthority({\n      operationId: submission.operationId,'''
          if old not in t:
            raise SystemExit('closeWithdrawnAuthority method anchor missing')
          t = t.replace(old, new, 1)
          p.write_text(t)
          PY

          git rm .github/workflows/pr35-i3-retry.yml

      - name: Validate closure and review fixes
        shell: bash
        run: |
          set +e
          npm run check > /tmp/pr35-check.log 2>&1
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            python <<'PY'
          from pathlib import Path
          text = Path('/tmp/pr35-check.log').read_text(errors='replace')
          tail = text[-6000:].replace('%','%25').replace('\r','%0D').replace('\n','%0A')
          print(f'::error title=PR35 validation failure::{tail}')
          PY
            cat /tmp/pr35-check.log
            exit "$rc"
          fi
          cat /tmp/pr35-check.log

      - name: Commit closure
        shell: bash
        run: |
          git config user.name "OpenAI review-fix bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Close interrupted structured authority truthfully"
          git push origin HEAD:agent/structured-obligation-v1
