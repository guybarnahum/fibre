name: pr35-fix-i3-inspector

on:
  push:
    branches:
      - agent/structured-obligation-v1

permissions:
  contents: write

jobs:
  fix:
    if: ${{ github.event.head_commit.message == 'Fix PR35 authority-withdrawal inspector shape' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/structured-obligation-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fix normalized obligation shape in verifier
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          p=Path('services/world-kernel/src/structured-obligation-inspection-store.mjs')
          t=p.read_text()
          if 'current.obligation.revision' not in t or 'current.obligation.status' not in t:
            raise SystemExit('expected authority-withdrawal inspection anchors missing')
          t=t.replace('current.obligation.revision','current.revision')
          t=t.replace('current.obligation.status','current.status')
          p.write_text(t)
          PY
      - name: Focused causal proof
        run: |
          npm run build
          node --disable-warning=ExperimentalWarning --test services/world-kernel/test/causal-process.test.mjs
      - name: Full validation
        run: npm run check
      - name: Commit verified fix
        shell: bash
        run: |
          git config user.name "OpenAI review-fix bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pr35-fix-i3-inspector.yml
          git add -A
          git commit -m "Verify authority-withdrawal closure across restart"
          git push origin HEAD:agent/structured-obligation-v1
