name: pr35-i3-land

on:
  push:
    branches:
      - agent/structured-obligation-v1

permissions:
  contents: write

jobs:
  fix:
    if: ${{ github.event.head_commit.message == 'Land PR35 authority-withdrawal closure' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/structured-obligation-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply final candidate
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          source=Path('.github/workflows/pr35-i3-finalize.yml').read_text()
          marker='      - name: Apply corrected closure and route ownership\n        shell: bash\n        run: |\n'
          start=source.index(marker)+len(marker)
          end=source.index('\n      - name: Focused causal proof',start)
          lines=source[start:end].splitlines()
          Path('/tmp/apply.sh').write_text('\n'.join(line[10:] if line.startswith('          ') else line for line in lines)+'\n')
          PY
          bash /tmp/apply.sh
          python <<'PY'
          from pathlib import Path
          p=Path('services/world-kernel/src/structured-authority-withdrawal.mjs'); t=p.read_text()
          old='''export function structuredAuthorityWithdrawalDigest(value) {\n  return sha256(canonicalJson(normalizeStructuredAuthorityWithdrawal(value)));\n}'''
          new='''export function structuredAuthorityWithdrawalDigest(value) {\n  return `sha256:${sha256(canonicalJson(normalizeStructuredAuthorityWithdrawal(value)))}`;\n}'''
          if old not in t: raise SystemExit('closure digest anchor missing')
          p.write_text(t.replace(old,new,1))

          p=Path('services/world-kernel/src/structured-authority-withdrawal-store.mjs'); t=p.read_text()
          old='''  return sha256(canonicalJson({\n    kind: "structured_authority_withdrawal/1",\n    operationId: input.operationId,\n    threadId: input.threadId,\n    sessionId: input.sessionId,\n    causationId: input.causationId,\n    correlationId: input.correlationId,\n  }));'''
          new='''  return `sha256:${sha256(canonicalJson({\n    kind: "structured_authority_withdrawal/1",\n    operationId: input.operationId,\n    threadId: input.threadId,\n    sessionId: input.sessionId,\n    causationId: input.causationId,\n    correlationId: input.correlationId,\n  }))}`;'''
          if old not in t: raise SystemExit('operation digest anchor missing')
          p.write_text(t.replace(old,new,1))
          PY

      - name: Focused causal proof
        shell: bash
        run: |
          npm run build
          node --disable-warning=ExperimentalWarning --test services/world-kernel/test/causal-process.test.mjs

      - name: Full validation
        shell: bash
        run: npm run check

      - name: Commit closure
        shell: bash
        run: |
          git config user.name "OpenAI review-fix bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/pr35-i3-closure.yml .github/workflows/pr35-i3-retry.yml .github/workflows/pr35-i3-debug.yml .github/workflows/pr35-i3-finalize.yml .github/workflows/pr35-i3-stack.yml .github/workflows/pr35-i3-land.yml
          git add -A
          git commit -m "Close interrupted structured authority truthfully"
          git push origin HEAD:agent/structured-obligation-v1
