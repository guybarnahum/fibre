name: pr35-review-fixes-runner

on:
  push:
    branches:
      - agent/structured-obligation-v1

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !startsWith(github.event.head_commit.message, 'Apply PR35 review fixes') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/structured-obligation-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply original fix script
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          text = Path('.github/workflows/pr35-review-fixes.yml').read_text()
          start = text.index("          python <<'PY'\n") + len("          python <<'PY'\n")
          end = text.index("\n          PY\n", start)
          lines = text[start:end].splitlines()
          script = "\n".join(line[10:] if line.startswith("          ") else line for line in lines) + "\n"
          Path('/tmp/apply-pr35-review-fixes.py').write_text(script)
          PY
          python /tmp/apply-pr35-review-fixes.py
      - name: Correct adversarial assertion ordering
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          p = Path('services/world-kernel/test/structured-obligation-inspection-process.test.mjs')
          text = p.read_text()
          old = '/applicability derived result does not match persisted evidence/'
          new = '/(?:discharge applicability digest|applicability derived result) does not match persisted evidence/'
          if old not in text:
            raise SystemExit('expected assertion anchor missing')
          p.write_text(text.replace(old, new, 1))
          PY
      - name: Validate fixes
        run: npm run check
      - name: Commit fixes
        shell: bash
        run: |
          git config user.name "OpenAI review-fix bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/world-kernel/src apps/thread-editor services/world-kernel/test tools/thread-editor-expression-readable.test.mjs
          git commit -m "Apply PR35 review fixes: integrity and consent surfaces"
          git push origin HEAD:agent/structured-obligation-v1
