name: pr35-review-fixes

on:
  push:
    branches:
      - agent/structured-obligation-v1

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !startsWith(github.event.head_commit.message, 'Apply PR35 review fixes') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/structured-obligation-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply review fixes
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"missing replacement anchor in {path}: {old[:120]!r}")
              if text.count(old) != 1:
                  raise SystemExit(f"replacement anchor not unique in {path}: {old[:120]!r}")
              p.write_text(text.replace(old, new, 1))

          def append_once(path, marker, addition):
              p = Path(path)
              text = p.read_text()
              if marker in text:
                  return
              p.write_text(text.rstrip() + "\n\n" + addition.strip() + "\n")

          # B1: public ObligationStore cannot mint the terminal discharge fact.
          replace_once(
              "services/world-kernel/src/obligation-store.mjs",
              '''    const obligation = normalizeStructuredObligation(structuredClone(candidate));\n    assertIsoTimestamp("recordedAt", recordedAt);''',
              '''    const obligation = normalizeStructuredObligation(structuredClone(candidate));\n    if (obligation.status === "discharged") {\n      throw new ObligationConflictError(\n        "discharged status may only be authored by the atomic Structured Obligation freeze/discharge path",\n      );\n    }\n    assertIsoTimestamp("recordedAt", recordedAt);''',
          )

          # B1 + I1: inspection verifies terminal consequences in both directions and re-derives policy.
          replace_once(
              "services/world-kernel/src/structured-obligation-inspection-store.mjs",
              '''import {\n  normalizeStructuredObligation,\n  structuredObligationDigest,\n} from "./obligation-domain.mjs";''',
              '''import {\n  deterministicApplicability,\n  normalizeStructuredObligation,\n  structuredObligationDigest,\n} from "./obligation-domain.mjs";''',
          )
          replace_once(
              "services/world-kernel/src/structured-obligation-inspection-store.mjs",
              '''    const history = rows.map(rowToObligationRevision);\n    assertHistory(history, threadId, obligationId);\n    return history;''',
              '''    const history = rows.map(rowToObligationRevision);\n    assertHistory(history, threadId, obligationId);\n    for (const revision of history) {\n      if (revision.obligation.status !== "discharged") continue;\n      const witnesses = this.#database.prepare(`\n        SELECT discharge_id,terminal_obligation_digest\n        FROM structured_obligation_discharges\n        WHERE thread_id=? AND obligation_id=? AND terminal_revision=?\n      `).all(threadId, obligationId, revision.obligation.revision);\n      if (witnesses.length !== 1) {\n        throw new IntegrityError(\n          `discharged obligation ${obligationId} revision ${revision.obligation.revision} must have exactly one discharge witness`,\n        );\n      }\n      same(\n        "discharged revision witness digest",\n        witnesses[0].terminal_obligation_digest,\n        revision.obligationDigest,\n      );\n    }\n    return history;''',
          )
          replace_once(
              "services/world-kernel/src/structured-obligation-inspection-store.mjs",
              '''      const obligation = this.#database.prepare(`\n        SELECT obligation_digest FROM obligation_records\n        WHERE thread_id=? AND obligation_id=? AND revision=?\n      `).get(\n        record.decision.threadId,\n        record.decision.obligationId,\n        record.decision.obligationRevision,\n      );\n      if (obligation === undefined) {\n        throw new IntegrityError(`applicability ${record.decision.applicabilityId} lost its obligation revision`);\n      }\n      same("applicability stored obligation digest", obligation.obligation_digest, record.decision.obligationDigest);\n      return record;''',
              '''      const obligation = this.#database.prepare(`\n        SELECT obligation_json,obligation_digest,legacy_source_digest\n        FROM obligation_records\n        WHERE thread_id=? AND obligation_id=? AND revision=?\n      `).get(\n        record.decision.threadId,\n        record.decision.obligationId,\n        record.decision.obligationRevision,\n      );\n      if (obligation === undefined) {\n        throw new IntegrityError(`applicability ${record.decision.applicabilityId} lost its obligation revision`);\n      }\n      const persistedObligation = normalizeStructuredObligation(\n        parseJson(\n          `applicability ${record.decision.applicabilityId} obligation revision`,\n          obligation.obligation_json,\n        ),\n      );\n      same(\n        "applicability obligation content digest",\n        obligation.obligation_digest,\n        structuredObligationDigest(persistedObligation),\n      );\n      same("applicability stored obligation digest", obligation.obligation_digest, record.decision.obligationDigest);\n      const legacyTombstoned = obligation.legacy_source_digest !== null &&\n        this.#database.prepare(`\n          SELECT 1 AS present FROM legacy_obligation_tombstones\n          WHERE thread_id=? AND legacy_reference_digest=?\n        `).get(record.decision.threadId, obligation.legacy_source_digest) !== undefined;\n      const derived = deterministicApplicability(persistedObligation, {\n        threadId: record.decision.threadId,\n        requestFingerprint: record.decision.requestFingerprint,\n        decidedAt: record.decision.decidedAt,\n        legacyTombstoned,\n      });\n      same("applicability derived result", record.decision.result, derived.result);\n      same("applicability derived reason", record.decision.reasonCode, derived.reasonCode);\n      return record;''',
          )
          replace_once(
              "services/world-kernel/src/structured-obligation-inspection-store.mjs",
              '''      dischargeCausalChainsVerified: true,\n    };\n  }\n}''',
              '''      dischargeCausalChainsVerified: discharges.every((item) => item.causalChainVerified),\n    };\n  }\n}''',
          )

          # I2: legacy freeze integrity now knows whether a structured discharge must exist.
          replace_once(
              "services/world-kernel/src/freeze-store.mjs",
              '''import {\n  persistStructuredObligationDischarge,\n  prepareStructuredObligationDischarge,\n} from "./structured-obligation-discharge-store.mjs";''',
              '''import {\n  persistStructuredObligationDischarge,\n  prepareStructuredObligationDischarge,\n} from "./structured-obligation-discharge-store.mjs";\nimport {\n  normalizeStructuredObligationDischarge,\n  structuredObligationDischargeDigest,\n} from "./structured-obligation-discharge.mjs";''',
          )
          replace_once(
              "services/world-kernel/src/freeze-store.mjs",
              '''  verifyFreezeIntegrity(threadId, sessionId) {\n    const freeze = this.getFreeze(threadId, sessionId);\n    return {''',
              '''  verifyFreezeIntegrity(threadId, sessionId) {\n    const freeze = this.getFreeze(threadId, sessionId);\n    const authorizationRow = this.#database.prepare(`\n      SELECT authorization_json,authorization_digest\n      FROM participation_authorizations WHERE authorization_id=?\n    `).get(freeze.report.authorizationId);\n    if (authorizationRow === undefined) {\n      throw new IntegrityError(`freeze ${freeze.report.reportId} lost its participation authorization`);\n    }\n    const authorization = parseJson(\n      `freeze authorization ${freeze.report.authorizationId}`,\n      authorizationRow.authorization_json,\n    );\n    same(\n      "freeze authorization digest",\n      authorizationDigest(authorization),\n      authorizationRow.authorization_digest,\n    );\n    const dischargeRows = this.#database.prepare(`\n      SELECT discharge_id,terminal_revision,discharge_json,discharge_digest\n      FROM structured_obligation_discharges\n      WHERE thread_id=? AND session_id=? AND freeze_operation_id=?\n    `).all(threadId, sessionId, freeze.consumption.operationId);\n    let structuredDischarge = null;\n    if (authorization.participationBasis === "obligation_override") {\n      if (dischargeRows.length !== 1) {\n        throw new IntegrityError(\n          `structured compelled freeze ${freeze.report.reportId} must have exactly one discharge witness`,\n        );\n      }\n      const row = dischargeRows[0];\n      const discharge = normalizeStructuredObligationDischarge(\n        parseJson(`structured discharge ${row.discharge_id}`, row.discharge_json),\n      );\n      same("structured discharge digest", structuredObligationDischargeDigest(discharge), row.discharge_digest);\n      same("structured discharge Thread", discharge.threadId, threadId);\n      same("structured discharge session", discharge.sessionId, sessionId);\n      same("structured discharge authorization", discharge.authorizationId, freeze.report.authorizationId);\n      same("structured discharge freeze report", discharge.freezeReportId, freeze.report.reportId);\n      same("structured discharge freeze report digest", discharge.freezeReportDigest, freeze.reportDigest);\n      same("structured discharge event", discharge.eventId, freeze.event.eventId);\n      structuredDischarge = {\n        dischargeId: discharge.dischargeId,\n        terminalRevision: discharge.terminalRevision,\n        dischargeDigest: row.discharge_digest,\n      };\n    } else if (dischargeRows.length !== 0) {\n      throw new IntegrityError(\n        `non-structured freeze ${freeze.report.reportId} unexpectedly carries a Structured Obligation discharge`,\n      );\n    }\n    return {''',
          )
          replace_once(
              "services/world-kernel/src/freeze-store.mjs",
              '''      dischargedObligations: [...freeze.report.dischargedObligations],\n      runtimeCompleted: true,''',
              '''      dischargedObligations: [...freeze.report.dischargedObligations],\n      structuredDischarge,\n      runtimeCompleted: true,''',
          )

          # B2: expression uses the authoritative structured participation basis, not legacy prose refs.
          replace_once(
              "services/world-kernel/src/expression-domain.mjs",
              '''  const participationBasis =\n    authorization.desiredAction === authorization.authorizedAction\n      ? "aligned"\n      : "obligation_override";\n  if (\n    participationBasis === "obligation_override" &&\n    authorization.obligationReferences.length === 0\n  ) {\n    throw new IntegrityError(\n      "authorization divergence is missing its governing obligation reference",\n    );\n  }''',
              '''  const participationBasis = authorization.participationBasis === "obligation_override"\n    ? "obligation_override"\n    : authorization.participationBasis === "willing"\n      ? "aligned"\n      : authorization.desiredAction === authorization.authorizedAction\n        ? "aligned"\n        : "obligation_override";\n  const hasLegacyObligation = authorization.obligationReferences.length > 0;\n  const hasStructuredObligation =\n    authorization.applicability !== null &&\n    authorization.applicability !== undefined &&\n    typeof authorization.applicability.obligationId === "string";\n  if (\n    participationBasis === "obligation_override" &&\n    !hasLegacyObligation &&\n    !hasStructuredObligation\n  ) {\n    throw new IntegrityError(\n      "authorization divergence is missing its governing obligation evidence",\n    );\n  }''',
          )

          # B3: Thread Editor reads structured authorization truth directly.
          replace_once(
              "apps/thread-editor/expression-readable.js",
              '''  const inferredCompelled =\n    desired !== authorized &&\n    Array.isArray(authorization.obligationReferences) &&\n    authorization.obligationReferences.length > 0;\n  const compelled = strategy === null\n    ? inferredCompelled\n    : strategy.participationBasis === "obligation_override";''',
              '''  const inferredCompelled =\n    desired !== authorized &&\n    Array.isArray(authorization.obligationReferences) &&\n    authorization.obligationReferences.length > 0;\n  const compelled =\n    authorization.participationBasis === "obligation_override" ||\n    strategy?.participationBasis === "obligation_override" ||\n    inferredCompelled;''',
          )
          replace_once(
              "apps/thread-editor/expression-readable.js",
              '''    fact("Participation basis", strategy?.participationBasis),''',
              '''    fact(\n      "Participation basis",\n      strategy?.participationBasis ??\n        (authorization.participationBasis === "willing" ? "aligned" : authorization.participationBasis),\n    ),''',
          )
          replace_once(
              "apps/thread-editor/expression-readable.js",
              '''  if (strategy?.governingObligationReferences?.length > 0) {\n    notes.push(\n      `Private obligation references: ${strategy.governingObligationReferences.join("; ")}`,\n    );\n  }''',
              '''  if (authorization.applicability?.obligationId) {\n    notes.push(`Private Structured Obligation: ${authorization.applicability.obligationId}`);\n  } else if (strategy?.governingObligationReferences?.length > 0) {\n    notes.push(\n      `Private obligation references: ${strategy.governingObligationReferences.join("; ")}`,\n    );\n  }''',
          )

          replace_once(
              "apps/thread-editor/human-readable.js",
              '''  const actionDiverged = isRecorded(desiredAction) && isRecorded(authorizedAction) && desiredAction !== authorizedAction;\n  const hasObligationReferences = Array.isArray(obligationReferences) && obligationReferences.length > 0;\n  const obligationText = hasObligationReferences\n    ? obligationReferences.map((reference) => `“${reference}”`).join(", ")\n    : "no visible obligation reference";''',
              '''  const participationBasis = firstDefined(\n    authorization.participationBasis,\n    record.participationBasis,\n  );\n  const structuredObligationId = firstDefined(\n    authorization.applicability?.obligationId,\n    record.applicability?.obligationId,\n  );\n  const actionDiverged = isRecorded(desiredAction) && isRecorded(authorizedAction) && desiredAction !== authorizedAction;\n  const hasObligationReferences = Array.isArray(obligationReferences) && obligationReferences.length > 0;\n  const hasStructuredObligation = participationBasis === "obligation_override" && isRecorded(structuredObligationId);\n  const hasObligationAuthority = hasStructuredObligation || hasObligationReferences;\n  const obligationText = hasStructuredObligation\n    ? `Structured Obligation ${structuredObligationId}`\n    : hasObligationReferences\n      ? obligationReferences.map((reference) => `“${reference}”`).join(", ")\n      : "no visible obligation reference";''',
          )
          replace_once(
              "apps/thread-editor/human-readable.js",
              '''  const summary = actionDiverged\n    ? hasObligationReferences\n      ? `The Thread's own recorded response was ${formatHumanValue(desiredAction)}, but the world kernel authorized ${formatHumanValue(authorizedAction)} under ${obligationText}. This is compelled participation, not consent. ${lifecycleSummary}`\n      : `The Thread's own recorded response was ${formatHumanValue(desiredAction)}, but the world kernel authorized ${formatHumanValue(authorizedAction)} and this payload shows no obligation reference. Do not interpret the authorization as consent; inspect the exact JSON. ${lifecycleSummary}`''',
              '''  const summary = actionDiverged\n    ? hasObligationAuthority\n      ? `The Thread's own recorded response was ${formatHumanValue(desiredAction)}, but the world kernel authorized ${formatHumanValue(authorizedAction)} under ${obligationText}. This is compelled participation, not consent. ${lifecycleSummary}`\n      : `The Thread's own recorded response was ${formatHumanValue(desiredAction)}, but the world kernel authorized ${formatHumanValue(authorizedAction)} and this payload shows no obligation reference. Do not interpret the authorization as consent; inspect the exact JSON. ${lifecycleSummary}`''',
          )
          replace_once(
              "apps/thread-editor/human-readable.js",
              '''      hasObligationReferences\n        ? `The Thread's recorded response (${formatHumanValue(desiredAction)}) was overridden by authorization (${formatHumanValue(authorizedAction)}) using obligation ${obligationText}. The authorization allowed execution; it did not convert compulsion into consent.`''',
              '''      hasObligationAuthority\n        ? `The Thread's recorded response (${formatHumanValue(desiredAction)}) was overridden by authorization (${formatHumanValue(authorizedAction)}) using ${obligationText}. The authorization allowed execution; it did not convert compulsion into consent.`''',
          )
          replace_once(
              "apps/thread-editor/human-readable.js",
              '''      fact("Obligation override", actionDiverged ? obligationReferences : null, "obligationReferences"),''',
              '''      fact(\n        "Obligation override",\n        actionDiverged\n          ? (hasStructuredObligation ? structuredObligationId : obligationReferences)\n          : null,\n        "obligationReferences",\n      ),''',
          )

          # I4: caller idempotency/conflict outcomes are 4xx, not false 500 integrity incidents.
          replace_once(
              "services/world-kernel/src/causal-http-server.mjs",
              '''import { GuardianModelError } from "./guardian-model-adapter.mjs";''',
              '''import { GuardianModelError } from "./guardian-model-adapter.mjs";\nimport {\n  ApplicabilityConflictError,\n  ApplicabilityNotFoundError,\n  ApplicabilityRequestNotFoundError,\n} from "./obligation-applicability-store.mjs";\nimport {\n  ObligationConflictError,\n  ObligationNotFoundError,\n  StaleObligationRevisionError,\n} from "./obligation-store.mjs";''',
          )
          replace_once(
              "services/world-kernel/src/causal-http-server.mjs",
              '''  if (value instanceof PrivateRequestConflictError) {\n    return [409, "PRIVATE_REQUEST_CONFLICT", value.message, {}];\n  }''',
              '''  if (value instanceof PrivateRequestConflictError) {\n    return [409, "PRIVATE_REQUEST_CONFLICT", value.message, {}];\n  }\n  if (\n    value instanceof ApplicabilityConflictError ||\n    value instanceof ObligationConflictError ||\n    value instanceof StaleObligationRevisionError\n  ) {\n    return [409, "STRUCTURED_OBLIGATION_CONFLICT", value.message, {}];\n  }\n  if (\n    value instanceof ApplicabilityNotFoundError ||\n    value instanceof ApplicabilityRequestNotFoundError ||\n    value instanceof ObligationNotFoundError\n  ) {\n    return [404, "STRUCTURED_OBLIGATION_NOT_FOUND", value.message, {}];\n  }''',
          )

          # I5: top-level Thread snapshots are exact-keyed; public state cannot spoof obligation vocabulary.
          replace_once(
              "services/world-kernel/src/persistence-domain.mjs",
              '''export function validateThreadSnapshot(thread) {\n  assertPlainObject("thread", thread);\n  assertId("thread.threadId", thread.threadId);''',
              '''export function validateThreadSnapshot(thread) {\n  assertPlainObject("thread", thread);\n  assertExactKeys("thread", thread, [\n    "threadId",\n    "version",\n    "status",\n    "identity",\n    "genome",\n    "currentState",\n    "accounts",\n    "relationshipRefs",\n    "memoryRefs",\n    "provenance",\n  ]);\n  assertId("thread.threadId", thread.threadId);''',
          )

          # Regression tests: B1.
          append_once(
              "services/world-kernel/test/obligation-store.test.mjs",
              'test("public ObligationStore cannot author discharged terminal revisions"',
              '''test("public ObligationStore cannot author discharged terminal revisions", () =>\n  withDatabase((databasePath) => {\n    const store = openObligationStore(databasePath);\n    store.recordRevision(obligation(), { recordedAt: "2026-08-09T20:01:00.000Z" });\n    assert.throws(\n      () => store.recordRevision(revision2({ status: "discharged" }), {\n        recordedAt: "2026-08-09T20:06:00.000Z",\n      }),\n      ObligationConflictError,\n    );\n    assert.equal(\n      store.getCurrentRevision(fixture.threadId, OBLIGATION_A).obligation.status,\n      "active",\n    );\n    store.close();\n  }));''',
          )

          # Regression tests: structured disclosure + B3-readable canonical authorization shape.
          replace_once(
              "services/world-kernel/test/structured-obligation-inspection-process.test.mjs",
              '''import { canonicalJson } from "../src/persistence-common.mjs";''',
              '''import { canonicalJson } from "../src/persistence-common.mjs";\nimport { applicabilityDecisionDigest } from "../src/obligation-schema.mjs";\nimport { openFreezeStore } from "../src/freeze-store.mjs";''',
          )
          replace_once(
              "services/world-kernel/test/structured-obligation-inspection-process.test.mjs",
              '''  const sessionId = continued.body.runtime.session.sessionId;\n  const applicabilityId = continued.body.applicability.decision.applicabilityId;\n\n  const actor = await json''',
              '''  const sessionId = continued.body.runtime.session.sessionId;\n  const applicabilityId = continued.body.applicability.decision.applicabilityId;\n\n  const disclosure = await json(\n    `${processHandle.baseUrl}/threads/${thread.threadId}/private/requests/${request.requestId}/disclosure`,\n    {\n      method: "POST",\n      headers: privateHeaders(true),\n      body: JSON.stringify({\n        operationId: "op_structured_inspection_disclosure",\n        authorizationId: continued.body.runtime.authorization.authorizationId,\n        strategy: {\n          mode: "full_candor",\n          communicatedPosture: "accept",\n          publicRationaleIntent: "State the compelled participation boundary without claiming consent.",\n          disclosedReasonCategories: ["recorded_obligation"],\n          withheldReasonCategories: ["private_feelings", "dignity_evidence"],\n          safeReferences: [],\n          privateRationale: "Preserve the Thread's private clarify stance while accurately disclosing compelled authority.",\n        },\n        causationId: "cause_structured_inspection_disclosure",\n        correlationId: "corr_structured_inspection",\n      }),\n    },\n  );\n  assert.equal(disclosure.response.status, 201);\n  assert.equal(disclosure.body.disclosure.strategy.participationBasis, "obligation_override");\n  assert.deepEqual(disclosure.body.disclosure.strategy.governingObligationReferences, []);\n\n  const response = await json(\n    `${processHandle.baseUrl}/threads/${thread.threadId}/private/requests/${request.requestId}/response`,\n    {\n      method: "POST",\n      headers: privateHeaders(true),\n      body: JSON.stringify({\n        operationId: "op_structured_inspection_response",\n        strategyId: disclosure.body.disclosure.strategy.strategyId,\n        causationId: "cause_structured_inspection_response",\n        correlationId: "corr_structured_inspection",\n      }),\n    },\n  );\n  assert.equal(response.response.status, 201);\n  assert.match(response.body.response.response.message, /recorded obligation/i);\n\n  const actor = await json''',
          )
          replace_once(
              "services/world-kernel/test/structured-obligation-inspection-process.test.mjs",
              '''    const admin = inspectStructuredObligations(databasePath, { threadId: life.thread.threadId });\n    assert.equal(admin.ok, true);\n    assert.equal(admin.sourceReadOnly, true);\n    assert.equal(admin.threads[0].integrity.dischargeCausalChainsVerified, true);''',
              '''    const admin = inspectStructuredObligations(databasePath, { threadId: life.thread.threadId });\n    assert.equal(admin.ok, true);\n    assert.equal(admin.sourceReadOnly, true);\n    assert.equal(admin.threads[0].integrity.dischargeCausalChainsVerified, true);\n\n    const freezeStore = openFreezeStore(databasePath);\n    try {\n      const freezeIntegrity = freezeStore.verifyFreezeIntegrity(\n        life.thread.threadId,\n        life.sessionId,\n      );\n      assert.ok(freezeIntegrity.structuredDischarge);\n      assert.match(freezeIntegrity.structuredDischarge.dischargeId, /^obd_/);\n      assert.equal(freezeIntegrity.structuredDischarge.terminalRevision, 2);\n    } finally {\n      freezeStore.close();\n    }''',
          )
          append_once(
              "services/world-kernel/test/structured-obligation-inspection-process.test.mjs",
              'test("F inspection rejects a discharged terminal revision whose causal witness is missing"',
              '''test("F inspection rejects a discharged terminal revision whose causal witness is missing", async () => {\n  const directory = mkdtempSync(join(tmpdir(), "fibre-structured-inspection-missing-witness-"));\n  const databasePath = join(directory, "world.sqlite");\n  let processHandle;\n  try {\n    processHandle = await startProcess(databasePath);\n    const life = await createCompletedCompelledLife(processHandle, databasePath);\n    await processHandle.stop();\n    processHandle = null;\n\n    const db = new DatabaseSync(databasePath, { enableForeignKeyConstraints: false });\n    try {\n      db.exec("DROP TRIGGER structured_obligation_discharges_no_delete");\n      db.prepare("DELETE FROM structured_obligation_discharges WHERE session_id=?").run(life.sessionId);\n    } finally {\n      db.close();\n    }\n\n    processHandle = await startProcess(databasePath);\n    const inspected = await json(\n      `${processHandle.baseUrl}/threads/${life.thread.threadId}/private/obligations/integrity`,\n      { headers: privateHeaders() },\n    );\n    assert.equal(inspected.response.status, 503);\n    assert.equal(inspected.body.error.code, "INTEGRITY_FAILURE");\n    assert.throws(\n      () => inspectStructuredObligations(databasePath, { threadId: life.thread.threadId }),\n      /must have exactly one discharge witness/,\n    );\n  } finally {\n    if (processHandle) await processHandle.stop().catch(() => {});\n    rmSync(directory, { recursive: true, force: true });\n  }\n});\n\ntest("F inspection re-derives deterministic applicability instead of trusting a re-signed outcome", async () => {\n  const directory = mkdtempSync(join(tmpdir(), "fibre-structured-inspection-applicability-tamper-"));\n  const databasePath = join(directory, "world.sqlite");\n  let processHandle;\n  try {\n    processHandle = await startProcess(databasePath);\n    const life = await createCompletedCompelledLife(processHandle, databasePath);\n    await processHandle.stop();\n    processHandle = null;\n\n    const db = new DatabaseSync(databasePath, { enableForeignKeyConstraints: false });\n    try {\n      db.exec("DROP TRIGGER obligation_applicability_decisions_no_update");\n      const row = db.prepare(\n        "SELECT decision_json FROM obligation_applicability_decisions WHERE applicability_id=?",\n      ).get(life.applicabilityId);\n      const forged = JSON.parse(row.decision_json);\n      forged.result = "does_not_apply";\n      forged.reasonCode = "request_binding_mismatch";\n      const digest = applicabilityDecisionDigest(forged);\n      db.prepare(`\n        UPDATE obligation_applicability_decisions\n        SET result=?,reason_code=?,decision_json=?,decision_digest=?\n        WHERE applicability_id=?\n      `).run(forged.result, forged.reasonCode, canonicalJson(forged), digest, life.applicabilityId);\n    } finally {\n      db.close();\n    }\n\n    processHandle = await startProcess(databasePath);\n    const inspected = await json(\n      `${processHandle.baseUrl}/threads/${life.thread.threadId}/private/obligations/integrity`,\n      { headers: privateHeaders() },\n    );\n    assert.equal(inspected.response.status, 503);\n    assert.equal(inspected.body.error.code, "INTEGRITY_FAILURE");\n    assert.throws(\n      () => inspectStructuredObligations(databasePath, { threadId: life.thread.threadId }),\n      /applicability derived result does not match persisted evidence/,\n    );\n  } finally {\n    if (processHandle) await processHandle.stop().catch(() => {});\n    rmSync(directory, { recursive: true, force: true });\n  }\n});''',
          )

          # Pure Thread Editor regression for canonical v1 structured authorization without a strategy.
          append_once(
              "tools/thread-editor-expression-readable.test.mjs",
              'test("canonical structured authorization alone renders compelled participation truthfully"',
